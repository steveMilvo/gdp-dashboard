name: Deploy PalengGo demo to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/review-palengo-spec-uhReG
    paths:
      - 'palenggo/demo/**'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload demo folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: palenggo/demo

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
