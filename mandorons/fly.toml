# fly.io config for the ManDorons static landing page.
# Deploy from this directory: cd mandorons && fly deploy
#
# First-time setup (run once):
#   fly auth login
#   fly apps create mandorons        # if "mandorons" is taken, pick another name
#   fly deploy
#   fly certs add mandorons.com.au
#   fly certs add www.mandorons.com.au
#
# Then add the DNS records fly prints in your GoDaddy DNS panel.

app = "mandorons"
primary_region = "syd"

[build]

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
